<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python in Browser</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>

<body>
    <h1>Python via Pyodide</h1>
    <pre id="output">Loading Python environment...</pre>

    <script>
        async function main() {
            try {
                // 1. Initialize Pyodide
                let pyodide = await loadPyodide();

                document.getElementById("output").textContent =
                    "Installing OpenCV...";

                // 2. Install OpenCV
                await pyodide.loadPackage("opencv-python");

                document.getElementById("output").textContent =
                    "Loading index.py...";

                // 3. Fetch Python file
                let response = await fetch("index.py");

                if (!response.ok) {
                    throw new Error(
                        `Failed to load index.py: ${response.statusText}`
                    );
                }

                let pythonCode = await response.text();

                // 4. Run Python
                let result = await pyodide.runPythonAsync(pythonCode);

                document.getElementById("output").textContent =
                    result !== undefined
                        ? result
                        : "Script executed successfully.";

            } catch (error) {
                document.getElementById("output").textContent =
                    "Error: " + error;
            }
        }

        main();
    </script>
</body>
</html>
